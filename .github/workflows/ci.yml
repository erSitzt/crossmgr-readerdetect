name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library:
    name: Libraries, CLI and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet build ReaderDetect.NoGui.slnf -c Release
      - run: dotnet test ReaderDetect.NoGui.slnf -c Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  windows:
    name: Windows build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet build crossmgr-readerdetect.sln -c Release
      - run: ./publish.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: readerdetect-win-x64
          path: dist/**/*.exe
